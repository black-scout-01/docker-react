
name: Build and Test

on:
  label:
    types:
      - created

jobs:
  test:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    # - name: Run docker commands
    #   run: |
    #     sudo docker stop reactv1
    #     sudo docker rm reactv1
    #     sudo docker build -t new:1.0 .
    #     sudo docker run -d -p 3004:3000 --name reactv1 new:1.0

    - name: Build image
      run: sudo docker build -t new:1.0 .

    - name: Trivy - scan repo files (deps, secrets, Dockerfile misconfig)
      run: |
        trivy fs . \
          --scanners vuln,secret,misconfig \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0

    - name: Trivy - scan Docker image
      run: |
        sudo trivy image new:1.0 \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0

    - name: Deploy
      run: |
        sudo docker stop reactv1 || true
        sudo docker rm reactv1 || true
        sudo docker run -d -p 3004:3000 --name reactv1 new:1.0
